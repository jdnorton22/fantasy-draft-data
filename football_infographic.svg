<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1B5E20;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D3B0F;stop-opacity:1" />
    </linearGradient>
    <!-- Card glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <!-- Subtle shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Field lines pattern -->
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#2E7D32" stroke-width="2" opacity="0.3" />
  <line x1="0" y1="126" x2="1200" y2="126" stroke="#2E7D32" stroke-width="1" opacity="0.15" />
  <line x1="0" y1="252" x2="1200" y2="252" stroke="#2E7D32" stroke-width="1" opacity="0.15" />
  <line x1="0" y1="378" x2="1200" y2="378" stroke="#2E7D32" stroke-width="1" opacity="0.15" />
  <line x1="0" y1="504" x2="1200" y2="504" stroke="#2E7D32" stroke-width="1" opacity="0.15" />
  <line x1="0" y1="630" x2="1200" y2="630" stroke="#2E7D32" stroke-width="2" opacity="0.3" />

  <!-- Hash marks -->
  <g opacity="0.1" stroke="#4CAF50" stroke-width="1">
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
  </g>

  <!-- Title bar accent -->
  <rect x="0" y="0" width="1200" height="6" fill="#FF8C00" />

  <!-- App title -->
  <text x="600" y="72" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#FFFFFF" letter-spacing="2">
    Fantasy Draft Picker
  </text>
  <text x="600" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#A5D6A7" letter-spacing="4">
    VERSION 4.1
  </text>

  <!-- Divider line -->
  <line x1="400" y1="125" x2="800" y2="125" stroke="#FF8C00" stroke-width="2" opacity="0.6" />

  <!-- ═══ Card 1: Mock Draft ═══ -->
  <g filter="url(#shadow)">
    <rect x="60" y="165" width="340" height="320" rx="16" fill="#1A3A1A" stroke="#2E7D32" stroke-width="1.5" />
  </g>

  <!-- Mock badge -->
  <rect x="145" y="195" width="130" height="40" rx="20" fill="#FF8C00" />
  <text x="210" y="222" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#FFFFFF" letter-spacing="2">
    MOCK
  </text>

  <!-- Football icon (simplified) -->
  <ellipse cx="230" cy="300" rx="55" ry="35" fill="none" stroke="#8D6E63" stroke-width="3" transform="rotate(-30 230 300)" />
  <ellipse cx="230" cy="300" rx="55" ry="35" fill="#6D4C41" opacity="0.3" transform="rotate(-30 230 300)" />
  <line x1="207" y1="275" x2="253" y2="325" stroke="#FFFFFF" stroke-width="2" opacity="0.5" />
  <!-- Laces -->
  <line x1="218" y1="286" x2="228" y2="282" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" />
  <line x1="222" y1="292" x2="232" y2="288" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" />
  <line x1="226" y1="298" x2="236" y2="294" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" />
  <line x1="230" y1="304" x2="240" y2="300" stroke="#FFFFFF" stroke-width="1.5" opacity="0.5" />

  <!-- Circular arrows around football (simulate/repeat icon) -->
  <path d="M 175 280 A 70 50 0 0 1 285 280" fill="none" stroke="#FF8C00" stroke-width="2.5" stroke-dasharray="6 4" />
  <polygon points="285,275 295,280 285,285" fill="#FF8C00" />
  <path d="M 285 320 A 70 50 0 0 1 175 320" fill="none" stroke="#FF8C00" stroke-width="2.5" stroke-dasharray="6 4" />
  <polygon points="175,315 165,320 175,325" fill="#FF8C00" />

  <!-- Card 1 text -->
  <text x="230" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">
    Mock Draft
  </text>
  <text x="230" y="412" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A5D6A7">
    Simulate full drafts with
  </text>
  <text x="230" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A5D6A7">
    AI-powered opponents
  </text>
  <text x="230" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#66BB6A" font-style="italic">
    Practice before draft day
  </text>

  <!-- ═══ Card 2: AI Advisor ═══ -->
  <g filter="url(#shadow)">
    <rect x="430" y="165" width="340" height="320" rx="16" fill="#1A3A1A" stroke="#2E7D32" stroke-width="1.5" />
  </g>

  <!-- Brain icon -->
  <g transform="translate(600, 270)" filter="url(#glow)">
    <!-- Brain outline -->
    <path d="M -30 -5 C -30 -30, -10 -42, 0 -42 C 10 -42, 30 -30, 30 -5 C 35 -5, 40 5, 35 15 C 38 22, 30 35, 20 35 C 15 40, 5 42, 0 38 C -5 42, -15 40, -20 35 C -30 35, -38 22, -35 15 C -40 5, -35 -5, -30 -5 Z"
          fill="none" stroke="#CE93D8" stroke-width="2.5" />
    <!-- Brain center line -->
    <line x1="0" y1="-42" x2="0" y2="38" stroke="#CE93D8" stroke-width="1.5" opacity="0.5" />
    <!-- Brain folds left -->
    <path d="M -5 -20 C -18 -18, -22 -5, -15 5" fill="none" stroke="#CE93D8" stroke-width="1.5" opacity="0.6" />
    <path d="M -5 5 C -20 8, -25 20, -15 28" fill="none" stroke="#CE93D8" stroke-width="1.5" opacity="0.6" />
    <!-- Brain folds right -->
    <path d="M 5 -20 C 18 -18, 22 -5, 15 5" fill="none" stroke="#CE93D8" stroke-width="1.5" opacity="0.6" />
    <path d="M 5 5 C 20 8, 25 20, 15 28" fill="none" stroke="#CE93D8" stroke-width="1.5" opacity="0.6" />
    <!-- Neural sparkles -->
    <circle cx="-15" cy="-15" r="2" fill="#CE93D8" opacity="0.8" />
    <circle cx="15" cy="-15" r="2" fill="#CE93D8" opacity="0.8" />
    <circle cx="-20" cy="10" r="2" fill="#CE93D8" opacity="0.6" />
    <circle cx="20" cy="10" r="2" fill="#CE93D8" opacity="0.6" />
    <circle cx="0" cy="0" r="3" fill="#CE93D8" opacity="0.9" />
  </g>

  <!-- Emoji label -->
  <text x="600" y="220" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36">
    🧠
  </text>

  <!-- Card 2 text -->
  <text x="600" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">
    AI Draft Advisor
  </text>
  <text x="600" y="412" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A5D6A7">
    Smart recommendations
  </text>
  <text x="600" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A5D6A7">
    based on value, need &amp; scarcity
  </text>
  <text x="600" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#66BB6A" font-style="italic">
    Injury-aware scoring
  </text>

  <!-- ═══ Card 3: 360+ Players ═══ -->
  <g filter="url(#shadow)">
    <rect x="800" y="165" width="340" height="320" rx="16" fill="#1A3A1A" stroke="#2E7D32" stroke-width="1.5" />
  </g>

  <!-- Player count big number -->
  <text x="970" y="275" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="72" font-weight="bold" fill="#FF8C00" filter="url(#glow)">
    360+
  </text>

  <!-- Position badges row -->
  <g transform="translate(970, 320)">
    <circle cx="-80" cy="0" r="16" fill="#1565C0" />
    <text x="-80" y="5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">QB</text>

    <circle cx="-40" cy="0" r="16" fill="#2E7D32" />
    <text x="-40" y="5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">RB</text>

    <circle cx="0" cy="0" r="16" fill="#C62828" />
    <text x="0" y="5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">WR</text>

    <circle cx="40" cy="0" r="16" fill="#F57F17" />
    <text x="40" y="5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">TE</text>

    <circle cx="80" cy="0" r="16" fill="#6A1B9A" />
    <text x="80" y="5" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="10" font-weight="bold" fill="#FFFFFF">K</text>
  </g>

  <!-- Card 3 text -->
  <text x="970" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold" fill="#FFFFFF">
    NFL Players
  </text>
  <text x="970" y="412" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A5D6A7">
    Full player database with
  </text>
  <text x="970" y="432" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#A5D6A7">
    ADP, stats &amp; injury data
  </text>
  <text x="970" y="465" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#66BB6A" font-style="italic">
    Updated for 2026 draft season
  </text>

  <!-- Bottom tagline bar -->
  <rect x="0" y="520" width="1200" height="110" fill="#0D3B0F" opacity="0.6" />
  <rect x="0" y="520" width="1200" height="2" fill="#2E7D32" opacity="0.4" />

  <!-- Football emoji + tagline -->
  <text x="600" y="570" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="bold" fill="#FFFFFF" letter-spacing="1">
    🏈  Draft Smarter. Win Your League.
  </text>
  <text x="600" y="605" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#81C784" letter-spacing="1">
    Mock Drafts  •  AI Recommendations  •  Draft Grades  •  Injury Alerts
  </text>

  <!-- Bottom accent bar -->
  <rect x="0" y="624" width="1200" height="6" fill="#FF8C00" />
</svg>
